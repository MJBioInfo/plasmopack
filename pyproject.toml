[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plasmopack"
version = "0.1.0.dev0"
description = "AnnData-native toolkit for Plasmodium and VEuPathDB organism bioinformatics"
readme = "README.md"
# Upper bound matches the versions we test and for which the scientific stack
# (h5py/numpy/scipy/pandas) ships binary wheels. Without this, installers may
# pick a too-new Python (e.g. 3.15) that has no h5py wheel and fail to build.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Majeed Jamakhani", email = "mjbioinfo@gmail.com" },
]
keywords = [
    "bioinformatics",
    "plasmodium",
    "malaria",
    "veupathdb",
    "single-cell",
    "anndata",
    "genomics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]

# Core dependencies ONLY. Everything else is an optional extra.
# This is the "minimum dependencies" contract — see publish/decisions.
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    # matplotlib is the one plotting dependency; like scipy it is foundational
    # and stable, and plotting (pp.pl) is core to a scanpy-style toolkit.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
deg = ["pydeseq2>=0.4"]
enrich = ["gseapy>=1.1"]
comp = ["sccoda>=0.1.9"]
ml = ["scikit-learn>=1.3"]
sc = ["scanpy>=1.10"]
all = [
    "pydeseq2>=0.4",
    "gseapy>=1.1",
    "sccoda>=0.1.9",
    "scikit-learn>=1.3",
    "scanpy>=1.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-jupyter>=0.25",
]

[project.urls]
Homepage = "https://github.com/MJBioInfo/plasmopack"
Documentation = "https://MJBioInfo.github.io/plasmopack"
Repository = "https://github.com/MJBioInfo/plasmopack"
Issues = "https://github.com/MJBioInfo/plasmopack/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plasmopack"]
# Ensure bundled gene-set snapshots (GMT + sidecars) ship inside the wheel.
artifacts = ["*.gmt", "*.gmt.meta.json"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["plasmopack"]

# ---------------------------------------------------------------------------
# Mypy — strict typing at boundaries (adapters/, io/)
# ---------------------------------------------------------------------------
[tool.mypy]
# Analysis target 3.12 so mypy can parse numpy's PEP 695 stubs. Our runtime
# floor stays 3.11: ruff (target-version py311) enforces 3.11-compatible syntax
# and CI runs the test suite on 3.11.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Strict only on the boundary layers; relax elsewhere for now.
[[tool.mypy.overrides]]
module = [
    "plasmopack.adapters.*",
    "plasmopack.io.*",
    "plasmopack._utils.*",
]
strict = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit live APIs (run only in nightly CI, not by default)",
]
